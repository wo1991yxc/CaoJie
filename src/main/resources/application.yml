# Spring Boot应用配置
spring:
  application:
    name: logback-demo
  profiles:
    active: dev
    
# 日志配置 - 解决临时文件问题的关键配置
logging:
  # 指定日志配置文件
  config: classpath:logback-spring.xml
  
  # 明确指定日志文件路径，避免默认使用/tmp目录
  file:
    # 日志文件路径 - 不要使用/tmp目录
    path: /var/logs/app
    # 或者直接指定文件名
    # name: /var/logs/app/application.log
  
  # 日志级别配置
  level:
    root: INFO
    com.example: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
    
  # 日志模式配置
  pattern:
    # 控制台日志格式
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
    # 文件日志格式
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# Actuator监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers,metrics
  endpoint:
    health:
      show-details: always

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  
logging:
  level:
    root: DEBUG
    com.example: DEBUG

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod
  
logging:
  level:
    root: WARN
    com.example: INFO
    
# 生产环境日志路径
  file:
    path: /opt/app/logs